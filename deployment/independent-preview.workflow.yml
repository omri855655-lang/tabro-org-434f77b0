name: Independent hosting preview
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: independent-preview
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: independent-preview
    env:
      VITE_SUPABASE_URL: ${{ vars.TABRO_SUPABASE_URL }}
      VITE_SUPABASE_PROJECT_ID: ${{ vars.TABRO_SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TABRO_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/check-independent-env.mjs
      - run: npm ci
      - run: node --experimental-strip-types --test tests/*.test.mjs
      - run: npm run build
      - run: npx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
