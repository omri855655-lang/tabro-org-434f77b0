<!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabro Aircraft QA</title><style>body{margin:0;background:#dbe5e9;color:#1e3f4d;font-family:sans-serif}h1{position:absolute;top:12px;right:24px;font-size:20px}p{position:absolute;bottom:12px;right:24px}canvas{display:block;width:100vw;height:100vh}</style></head><body><h1>מטוס הטרמינל · תצוגת בדיקה מקומית</h1><p>גרירה לסיבוב · האווטרים ויכולות החדר אינם משתנים</p><script type="module">
import * as THREE from 'three';
